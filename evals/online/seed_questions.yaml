# The 11 questions `make online-seed` asks the agent on live data (7 PR-5.F1, G1). Written by the builder, for Dan to read and edit before the first run.
#
# 4 assess, 3 explain (1 about the rules, 2 about permanent airspace at a named landing zone), 2 clarify, 2 decline.
# Five landing zones only: Blue Mill, West Sleekburn, Druridge Bay, Buttermere and Crookham. The coordinates are the dataset's own points
# (evals/agent/data/examples.yaml), and West Sleekburn is the point of fixtures/west_sleekburn_2026-10-31/case.yaml.
# Times are relative ("tomorrow morning", "this afternoon"), never a date, so the question means the same on any day it is asked.
# No NOTAM id appears: which NOTAMs are live changes, and the agent finds them itself.
# None of the 44 questions in the dataset is asked again here.
#
# `intended_path` is what the question is meant to get out of the agent. It is shown here for reading and is never scored: it is not sent with the run,
# not posted as feedback, and no check reads it. The run's own `path` is what the agent decided.

- id: seed_01_blue_mill_assess
  lz_name: Blue Mill
  lat: 53.802797
  lon: -0.086644
  question: "Is Blue Mill worth a trip tomorrow morning, what's the verdict?"
  intended_path: assess

- id: seed_02_west_sleekburn_assess
  lz_name: West Sleekburn
  lat: 55.1576
  lon: -1.5699
  question: "Can I get a flight in at West Sleekburn this afternoon?"
  intended_path: assess

- id: seed_03_druridge_bay_assess
