# FlySafeLZ dataset: Dan's examples (spec §4). Questions only; verdict labels go in verdict_sheet.yaml (built by 4b).
# One entry per question. Several questions can share one case (same LZ + same `now`): fewer fixtures to capture.
# `now` must be a past time (UTC, Z) so the PIB archive and Open-Meteo's historical forecast cover it.
# Held-out target ~15 (write these first): assess 7 · explain 3 · clarify 2 · decline 3, with >=2 tricky.
# Dev target ~35-40: same mix, scaled (assess ~19 · explain ~9 · clarify ~3 · decline ~7).
# Include across both: 2-3 OUTLOOK (slot 4-7 days after `now`), 2-3 UNVERIFIED (Vector drops a fixture source; set failure_source).
# The first 10 assess examples you write with `blind: true` are the 10 blind labels.

# Window convention (Titan, 2026-11-07): morning 07-12, afternoon 12-18, evening 17-dusk, "today" = now to local midnight (night rows label NO_GO). Windows are UTC; BST = UTC+1 until 25 Oct.
# Compound questions (Spec §3): one primary `path` by precedence clarify > assess > explain > decline; metadata compound/parts; extra parts scored by required_tools + must_mention.
# notam_category is left blank (~) where it needs a semantic call; it's set at labelling, not here.

# ===================== HELD-OUT (15) — Dan's wording, from Held-out Blueprint.md =====================
