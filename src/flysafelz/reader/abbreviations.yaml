# Abbreviations the NOTAM reader is told about (G2): UK AIP GEN 2.2 and ICAO Doc 8400.
#
# A row goes into the prompt only when its abbreviation is a whole token of the NOTAM's E text, so a NOTAM is
# shown the few rows it uses and a NOTAM that uses none gets no table (src/flysafelz/reader/prompt.py).
#
# Licence check (PyNotam, github.com/slavak/PyNotam, the table the plan named as a candidate): its LICENSE is
# the GNU General Public License, version 2. Reusing its table would put this project under the GPL, so the rule
# is "reused if the licence allows it, written by hand if not": it does not allow it, and this table is written by hand.
# No PyNotam text or file is copied. The rows come from the two published lists named above, written from
# knowledge of them and not copied or machine-checked against the AIP page. Spot-check a row against GEN 2.2 before
# relying on one, and add rows here when a NOTAM turns up an abbreviation that is missing.
#
# Format: "ABBREVIATION": meaning. Keys are upper case, letters and digits only, at least two characters (a single
# letter would match a stray N or E) and quoted (YAML reads an unquoted NO or ON as a boolean). Rows are shown in this
# order.

