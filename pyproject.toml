[project]
name = "flysafelz"
version = "0.1.0"
description = "Deterministic go/no-go core for UK paramotor landing zones"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astral>=3.2",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.4",
    "pydantic>=2",
    "pyyaml",
    "shapely>=2.2.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-socket",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--disable-socket"
testpaths = ["tests"]
# The reader eval's scoring package, evals/reader_eval, sits at the repository root, outside src/.
pythonpath = ["."]

[tool.ruff]
# The code keeps a comment or a sentence on one line, so 200 columns, not the default 88.
line-length = 200
target-version = "py312"

[tool.ruff.lint]
# ruff's defaults (E4, E7, E9, F) plus import order and blind excepts.
extend-select = ["I", "BLE"]
