[project]
name = "flysafelz"
version = "0.1.0"
description = "Deterministic go/no-go core for UK paramotor landing zones"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentevals>=0.0.9",
    "astral>=3.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "pydantic>=2",
    "pypdf>=7.0.0",
    "pyyaml",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "starlette>=1.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.42",
    "pytest",
    "pytest-cov>=7.1.0",
    "pytest-socket",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Internet sockets stay blocked. Unix sockets are allowed because asyncio's event loop opens a socketpair, which the map routes' ASGI tests need.
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
# The reader eval's scoring package, evals/reader_eval, sits at the repository root, outside src/.
pythonpath = ["."]

[tool.ruff]
# The code keeps a comment or a sentence on one line, so 200 columns, not the default 88.
line-length = 200
target-version = "py312"

[tool.ruff.lint]
# ruff's defaults (E4, E7, E9, F) plus import order and blind excepts.
extend-select = ["I", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Four findings in code from before slice 7. They are ignored here, not edited in the source: PR-7.F1's fence (F1) says the slice
# changes nothing under src/flysafelz, and any byte change to assess.py would also make the finalised verdict sheet stale
# (it hashes assess.py), which needs Dan's `make dataset` re-finalise. No behaviour is involved in any of them.
"src/flysafelz/assess.py" = ["RUF007"]  # zip(edges, edges[1:]) is clear; itertools.pairwise would only be a byte change
"src/flysafelz/reader/prompt.py" = ["TRY004"]  # ValueError is the contract: callers and tests catch it for every bad abbreviation file
"src/flysafelz/verdict_sheet.py" = ["I001", "PLC0414"]  # the two verdict_sheet_check import lines; `load_sheet as load_sheet` is the re-export 5a imports
